name: Daily News Scraper & Email

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: write 
  pages: write     
  id-token: write  

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -q -U google-generativeai 
          # 注意这行一定要有 google-search-results
          pip install requests pandas yfinance beautifulsoup4 google-search-results

      - name: Execute Scraper
        env:
          MY_PROXY_URL: ${{ secrets.PROXY_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scraper.py

      # ⚠ 众筹看板（kickstarter.html / ks_data.json / ks_history.csv）不在 CI 里抓取。
      # 实测 GitHub Actions 的机房出口 IP 会被 Cloudflare 全线拒绝：连 discover
      # 的 JSON 接口都返回 403 "Just a moment..."，详情页更拿不到原始 HTML，
      # 解析不出档次价格，只会用残缺数据覆盖完整数据。
      # 因此该看板改由本机（住宅出口 IP 可正常抓取）执行：
      #   python kickstarter_scraper.py --push
      # 即 pull --rebase → 抓取 → 写 ks_data.json / ks_history.csv →
      # 渲染 kickstarter.html → commit → push。文件进仓库后，
      # 本工作流的提交与 Pages 部署会自动把它一并发布。
      - name: Commit and Push update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A  # 关键修改：直接添加所有变更文件，防止报错
          git commit -m "Auto-update all dashboards: $(date)" || exit 0
          git push origin main --force

      # --- 关键：直接触发网页发布（无需等待） ---
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Email Notification
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 🚀 每日技术趋势报告 (包含 AI 翻译)
          to: ${{ secrets.MAIL_RECEIVER }}
          from: "Trend Monitor <${{ secrets.MAIL_USERNAME }}>"
          body: |
            你好！今天的技术资讯（含 Gemini 翻译）已更新。
            网页链接：https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          attachments: index.html
