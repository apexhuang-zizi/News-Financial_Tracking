name: Daily News Scraper & Email

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: write 
  pages: write     
  id-token: write  

# 与 Publish Pages 工作流串行，避免并发部署冲突
concurrency:
  group: github-pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -q -U google-generativeai 
          # 注意这行一定要有 google-search-results
          pip install requests pandas yfinance beautifulsoup4 google-search-results

      - name: Execute Scraper
        env:
          MY_PROXY_URL: ${{ secrets.PROXY_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scraper.py

      # ---- 众筹看板：与上面三张看板共用同一条定时、同一次提交（同频） ----
      # 抓取通道（脚本内 _proxy_url / fetch_text 自动降级，无需在此配置）：
      #   榜单 JSON：代理 -> 直连 -> r.jina.ai  →  机房 IP 下实测只有 Jina 通
      #   详情页 HTML（档次来源）：代理 -> 直连 -> Jina 的 X-Return-Format: html
      #     实测机房 IP 直连与机房代理都被 Cloudflare 403（6KB "Just a moment"），
      #     Jina 的 HTML 模式是唯一能透传原始 DOM（含 &quot;rewards&quot; 转义
      #     JSON）的通道；它对首次抓取的 URL 也常先回一次挑战页，脚本会退避重试。
      #   ★ 想进一步提成功率：去 jina.ai 免费注册拿 API Key，加到仓库密钥
      #     JINA_API_KEY —— 脚本会自动带上 Authorization 并启用浏览器引擎
      #     （免费额度 100 万 token/月，比匿名通道稳得多）。
      # 即使档次全拿不到，脚本也不再整页冻结：榜单金额/支持者/排名照常按今日
      # 发布，档次逐项沿用历史值并在页面标注「档次沿用」。因此本步骤不会因为
      # Cloudflare 而让看板停更（continue-on-error 仅作最后保险）。

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ runner.os }}-${{ hashFiles('.github/workflows/main.yml') }}
          restore-keys: whisper-${{ runner.os }}-

      # 语音识别引擎：装上才能生成视频中文字幕；装不上也不影响抓取，
      # kickstarter_scraper.py 检测不到 faster-whisper 会自动跳过字幕。
      - name: Install subtitle engine (faster-whisper)
        continue-on-error: true
        run: pip install -q faster-whisper

      - name: Execute Kickstarter scraper
        continue-on-error: true
        env:
          MY_PROXY_URL: ${{ secrets.PROXY_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: python kickstarter_scraper.py

      - name: Commit and Push update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ① 工作流文件绝不进入自动提交。
          #    GITHUB_TOKEN 是 GitHub App 令牌，GitHub 明文禁止它
          #    create/update .github/workflows/*，提交里只要带上就会被拒：
          #      refusing to allow a GitHub App to create or update workflow ...
          #    工作流文件只由人工推送维护，这里先还原、再从暂存区剔除。
          git checkout -- .github/workflows 2>/dev/null || true
          git add -A
          git reset -q -- .github/workflows 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "本次没有需要提交的变更，跳过"
            exit 0
          fi
          git commit -m "Auto-update all dashboards: $(date)"

          # ② 绝不使用 --force。
          #    force push 会把远端领先的提交整体回退（含人工提交的工作流改动、
          #    本机补抓的众筹数据），既丢数据，又因为"回退了 main.yml"而必然
          #    触发上面那条工作流保护报错。改为先对齐远端、再普通推送（快进）。
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort 2>/dev/null || true
              git merge -X ours --no-edit origin/main || true
            }
            # ③ 双保险：无论走哪条路径，工作流文件都以远端版本为准
            git checkout origin/main -- .github/workflows 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            if git push origin main; then
              echo "推送成功（第 $attempt 次尝试）"
              exit 0
            fi
            echo "第 $attempt 次推送失败，重试…"
          done
          echo "推送连续失败，请检查远端是否有并发写入" >&2
          exit 1

      # --- 关键：直接触发网页发布（无需等待） ---
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Email Notification
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 🚀 每日技术趋势报告 (包含 AI 翻译)
          to: ${{ secrets.MAIL_RECEIVER }}
          from: "Trend Monitor <${{ secrets.MAIL_USERNAME }}>"
          body: |
            你好！今天的技术资讯（含 Gemini 翻译）已更新。
            网页链接：https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          attachments: index.html
