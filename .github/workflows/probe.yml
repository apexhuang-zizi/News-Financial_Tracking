name: KS Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install candidates
        run: |
          pip install -q -U requests curl_cffi 2>&1 | tail -3 || true

      - name: Probe Kickstarter from GitHub IP
        env:
          MY_PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          U="https://www.kickstarter.com/projects/magpietech/aircannon-gpx-unleash-118mph-power-the-monster-blower"
          L="https://www.kickstarter.com/discover/advanced?category_id=52&sort=popularity&format=json"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"

          echo "===== 1. plain curl (list) ====="
          curl -sSL -m 45 -A "$UA" -o /tmp/l1 -w "HTTP:%{http_code} SIZE:%{size_download}\n" "$L"
          head -c 60 /tmp/l1; echo

          echo "===== 2. plain curl (detail) ====="
          curl -sSL -m 45 -A "$UA" -o /tmp/d1 -w "HTTP:%{http_code} SIZE:%{size_download}\n" "$U"
          head -c 80 /tmp/d1; echo

          echo "===== 3. curl with full browser headers (detail) ====="
          curl -sSL -m 45 -A "$UA" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -H "sec-ch-ua: \"Chromium\";v=\"126\", \"Not(A:Brand\";v=\"24\"" \
            -H "sec-ch-ua-mobile: ?0" -H "sec-ch-ua-platform: \"Windows\"" \
            -H "Sec-Fetch-Dest: document" -H "Sec-Fetch-Mode: navigate" \
            -H "Sec-Fetch-Site: none" -H "Sec-Fetch-User: ?1" \
            -H "Upgrade-Insecure-Requests: 1" \
            --http2 -o /tmp/d2 -w "HTTP:%{http_code} SIZE:%{size_download}\n" "$U"
          head -c 80 /tmp/d2; echo

          if [ -n "$MY_PROXY_URL" ]; then
            echo "===== 4. via PROXY_URL (detail) ====="
            curl -sSL -m 45 -x "$MY_PROXY_URL" -A "$UA" -o /tmp/d3 -w "HTTP:%{http_code} SIZE:%{size_download}\n" "$U"
            head -c 80 /tmp/d3; echo
            echo "===== 4b. via PROXY_URL (list) ====="
            curl -sSL -m 45 -x "$MY_PROXY_URL" -A "$UA" -o /tmp/l3 -w "HTTP:%{http_code} SIZE:%{size_download}\n" "$L"
            head -c 60 /tmp/l3; echo
          else
            echo "===== 4. PROXY_URL 未设置 ====="
          fi

          echo "===== 5. python curl_cffi impersonate=chrome (detail) ====="
          python - <<'PY'
          try:
              from curl_cffi import requests as creq
              u="https://www.kickstarter.com/projects/magpietech/aircannon-gpx-unleash-118mph-power-the-monster-blower"
              r=creq.get(u, impersonate="chrome", timeout=45)
              body=r.text
              n=body.count('&quot;rewards&quot;:')
              print("status=%s len=%d rewards_anchors=%d" % (r.status_code, len(body), n))
              print("head:", body[:80].replace("\n"," "))
          except Exception as e:
              print("curl_cffi 失败:", str(e)[:200])
          PY

          echo "===== 6. python requests (detail) ====="
          python - <<'PY'
          try:
              import requests
              u="https://www.kickstarter.com/projects/magpietech/aircannon-gpx-unleash-118mph-power-the-monster-blower"
              r=requests.get(u, headers={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"}, timeout=45)
              print("status=%s len=%d rewards=%d" % (r.status_code, len(r.text), r.text.count('&quot;rewards&quot;:')))
          except Exception as e:
              print("requests 失败:", str(e)[:200])
          PY

          echo "===== 7. external probe: 出口 IP ====="
          curl -sSL -m 20 https://api.ipify.org 2>/dev/null; echo
